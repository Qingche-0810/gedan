name: 打包 exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pypinyin
      - run: pyinstaller --onefile --windowed --name 歌单排序 gedan.py
      - uses: actions/upload-artifact@v4
        with:
          name: 歌单排序
          path: dist/歌单排序.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 歌单排序（最新）
          body: 双击 歌单排序.exe 就能用。改错了点「撤销上次编号」。
          files: dist/歌单排序.exe
          prerelease: false
